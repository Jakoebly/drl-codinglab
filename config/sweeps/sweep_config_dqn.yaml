program: main_sweeps.py

entity: gowiththetensorflow
project: Coding_Lab

method: bayes

metric:
  goal: maximize
  name: Charts/Average Reward

parameters:
    hyperparameters:
      parameters:
        gamma:
          min: 0.8
          max: 1
        epsilon:
          min: 0.75
          max: 1
        epsilon_min:
          min: 0
          max: 0.25
        epsilon_decay:
          min: 0.9
          max: 0.999
        learning_rate:
          distribution: normal
          mu: 0.00001
          sigma: 1
        batch_size:
          values: [16, 32, 64, 128, 256, 512]
        target_update_interval:
          values: [5, 10, 25, 50, 75, 100, 125, 150, 175]
        buffer_size:
          values: [1000, 60000, 80000, 100000, 150000, 300000]

command:
  - python
  - ${program}
  - "--algorithm"
  - "dqn"
  - "--variant"
  - "0"
  - "--mode"
  - "train"
  - "--track"
  - "--save"