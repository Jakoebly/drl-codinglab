program: main_sweeps.py

entity: gowiththetensorflow
project: Coding_Lab

method: bayes

metric:
  goal: maximize
  name: Charts/Average Reward

parameters:
  hyperparameters:
    parameters:
      learning_rate:
        distribution: log_normal
        mu: -10
        sigma: 0.01
      gamma:
        min: 0.8
        max: 0.9997
      epsilon:
        min: 0.75
        max: 1.0
      epsilon_min:
        min: 0.0
        max: 0.25
      epsilon_decay:
        min: 0.9
        max: 0.999
      batch_size:
        values: [16, 32, 64, 128, 256, 512]
      buffer_size:
        values: [1000, 60000, 80000, 100000, 150000, 300000]
  nn_architecture:
    parameters:
      num_layers:
        min: 1
        max: 8
      num_neurons:
        values: [128, 256, 512]
      activation_layers:
        values: ["relu", "tanh"]


command:
  - C:\Users\jakob\OneDrive\Uni\Master\3. Semester\Coding Lab\drl-codinglab\.venv\Scripts\python.exe
  - ${program}
  - "--algorithm"
  - "dqn"
  - "--variant"
  - "0"
  - "--mode"
  - "train"
  - "--track"