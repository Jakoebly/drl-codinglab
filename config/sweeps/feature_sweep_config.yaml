program: drl-codinglab\main.py

entity: gowiththetensorflow
project: Coding_Lab

method: bayes

metric:
  goal: maximize
  name: Charts/Avg. Validation Reward

parameters:
  features:
    parameters:
      prioritization_ratio_items:
        values: [0,1,2,3]
      manhatten_distance_agent_to_items:
        values: [True, False]
      manhatten_distance_target_to_items:
        values: [True, False]
      proximity_scores:
        values: [True, False]
      closest_item:
        values: [True, False]
      cumulative_timeout_risk:
        values: [True, False]
      distance_to_target:
        values: [True, False]
      remaining_episode_time:
        values: [True, False]
      vector_to_walls:
        values: [True, False]
      vector_closest:
        values: [True, False]

command:
  - python
  - /dss/dsshome1/lxc09/drlearn002/drl-codinglab-2/main.py
  - "--algorithm"
  - "dqn"
  - "--variant"
  - "0"
  - "--mode"
  - "train"
  - "--track"