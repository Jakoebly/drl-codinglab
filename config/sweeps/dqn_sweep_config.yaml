program: drl-codinglab\main.py

entity: gowiththetensorflow
project: Coding_Lab

method: bayes

metric:
  goal: maximize
  name: Charts/Avg. Validation Reward

parameters:
  hyperparameters:
    parameters:
      gamma:
        values: [0.9, 0.91, 0.92, 0.93, 0.94, 0.95, 0.96, 0.97, 0.98, 0.99]
      epsilon_decay:
        values: [0.98, 0.981, 0.982, 0.983, 0.984, 0.985, 0.986, 0.987, 0.988, 0.989, 0.99, 0.991, 0.992, 0.993, 0.994, 0.995, 0.996, 0.997, 0.998, 0.999]
      learning_rate:
        min: 0.000005
        max: 0.0001
      batch_size:
        values: [64, 128, 256, 512]
      target_update_interval:
        values: [15, 30, 50, 75, 100, 125, 150, 175, 199]
      buffer_size:
        values: [10000, 25000, 50000, 75000, 100000, 150000, 200000, 250000, 300000]
        
command:
  - python
  # - /dss/dsshome1/lxc09/drlearn002/drl-codinglab-2/main.py
  - ${program}
  - "--algorithm"
  - "dqn"
  - "--variant"
  - "0"
  - "--mode"
  - "train"
  - "--track"