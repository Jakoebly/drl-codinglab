program: drl-codinglab\main.py

entity: gowiththetensorflow
project: Coding_Lab

method: bayes

metric:
  goal: maximize
  name: Charts/Avg. Validation Reward

parameters:
  nn_architecture:
    parameters:
      num_convolutional_layers:
        min: 2
        max: 4
      num_convolutional_channels:
        values: [64, 128, 256, 512]
      kernel_size:
        values: [2,3,4,5]
      stride:
        values: [1,2]
      num_fully_connected_layers:
        values: [3,4,5]
      num_neurons_fully_connected:
        values: [128, 256, 512]
      activation_convolutional_layers:
        values: ["relu", "tanh"]
      activation_fully_connected_layers:
        values: ["relu", "tanh"]

command:
  - python
  # - /dss/dsshome1/lxc09/drlearn002/drl-codinglab-2/main.py
  - ${program}
  - "--algorithm"
  - "dqn"
  - "--variant"
  - "0"
  - "--mode"
  - "train"
  - "--track"