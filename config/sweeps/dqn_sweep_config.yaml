program: drl-codinglab\main.py

entity: gowiththetensorflow
project: Coding_Lab

method: bayes

metric:
  goal: maximize
  name: Charts/Avg. Validation Reward

parameters:
  extensions:
    parameters:
      vanilla:
        values: [True, False]
      multi_step:
        values: [True, False]
      noisy:
        values: [True, False]
      distribution:
        values: [True, False]
      dueling:
        values: [True, False]
      replay:
        values: [True, False]
      rainbow:
        values: [True, False]
        
command:
  - C:\Users\Marc\coding-lab\drl-codinglab\.venv\Scripts\python.exe
  - ${program}
  - "--algorithm"
  - "dqn"
  - "--variant"
  - "0"
  - "--mode"
  - "train"
  - "--track"