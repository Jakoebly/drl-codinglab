program: main.py

entity: gowiththetensorflow
project: Coding_Lab

method: bayes

metric:
  goal: maximize
  name: Charts/Avg. Validation Reward

parameters:
  hyperparameters:
    parameters:
      learning_rate_actor:
        values: [0.01, 0.001, 0.0001, 0.00001]
      learning_rate_critic:
        values: [0.01, 0.001, 0.0001, 0.00001]
      gamma:
        values: [0.999, 0.99, 0.93, 0.9]
      lam:
        values: [0.9, 0.95, 1.0]
      clip_ratio:
        values: [ 0.1, 0.2, 0.3 ]
      entropy_coef:
        values: [ 0.0, 0.01, 0.1, 0.5 ]
      num_trajectories:
        values: [ 2, 5, 10, 20, 50 ]
      num_epochs:
        values: [4, 8, 16, 32, 64]
      num_minibatches:
        values: [4, 8, 16, 32, 64]
  nn_architecture_actor:
    parameters:
      num_layers:
        min: 1
        max: 5
      num_neurons:
        values: [32, 64, 128, 256, 512]
      activation_layers:
        values: ["relu", "tanh"]
  nn_architecture_critic:
    parameters:
      num_layers:
        min: 1
        max: 5
      num_neurons:
        values: [32, 64, 128, 256, 512]
      activation_layers:
        values: [ "relu", "tanh"]

command:
  - C:\Users\jakob\OneDrive\Uni\Master\3. Semester\Coding Lab\drl-codinglab\.venv\Scripts\python.exe
  - ${program}
  - "--algorithm"
  - "ppo"
  - "--variant"
  - "0"
  - "--mode"
  - "train"
  - "--track"