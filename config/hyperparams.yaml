DQN:
  eval_settings:
    eval_interval: 100
    evaluation_treshold: 0.000
    evaluation_episodes: 50

  extensions: ["dueling"]

  hyperparameters:
    gamma: 0.9
    epsilon: 1.0
    epsilon_min: 0.15
    epsilon_decay: 0.99
    learning_rate: 0.00001
    batch_size: 64
    target_update_interval: 150
    buffer_size: 80000

  nn_architecture:
    structure: "DNN"
    num_layers: 4
    num_neurons: 256
    activation_layers: "relu"
    activation_output:

PPO:
  learning_rate_actor: 0.0001
  learning_rate_critic: 0.0001
  gamma: 0.99
  lam: 0.95
  clip_ratio: 0.3
  value_coef: 0.8
  entropy_coef: 0.3
  entropy_coef_min: 000
  entropy_coef_decay: 000
  num_trajectories: 20
  num_epochs: 2
  num_minibatches: 4
  max_grad_norm: 0.5
  num_neurons_actor: 128
  num_layers_actor: 3
  activation_actor: "relu"
  num_neurons_critic: 256
  num_layers_critic: 5
  activation_critic: "relu"

SAC:
  gamma: 000
  initial_alpha: 000
  alpha_decay: 000
  rho: 000
  mem_maxlen: 000
  batch_size: 000
  learning_rate: 000