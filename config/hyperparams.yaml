DQN:
  hyperparameters:
    gamma: 0.95
    epsilon: 1.0
    epsilon_min: 0.118
    epsilon_decay: 0.985
    learning_rate: 0.0000105
    batch_size: 256
    target_update_interval: 150
    buffer_size: 200000

  extensions:
    noisy: True
    distribution: True
    dueling: True
    priority: True
    double: True
    multi_step: True

  extension_parameters:
    alpha: 0.5
    beta: 0.7
    n_steps: 3
    noisy_layers: 2
    num_atoms: 10
    num_layers_stream: 1
    num_neurons_stream: 128
    std_init: 0.5
    v_max: 50
    v_min: -1

  # nn_architecture:
  #   structure: "CNN"
  #   num_convolutional_layers: 4
  #   num_convolutional_channels: 64
  #   kernel_size: 2
  #   stride: 2
  #   padding: 1
  #   num_neurons_fully_feature_input: 64
  #   num_layers: 4
  #   num_neurons: 512
  #   activation_convolutional_layers: "tanh"
  #   activation_layers: "tanh"
  #   activation_output:

  nn_architecture:
    structure: "DNN"
    num_layers: 5
    num_neurons: 512
    activation_layers: "tanh"
    activation_output:

  eval_settings:
    eval_interval: 100
    evaluation_treshold: 0.000
    evaluation_episodes: 100

PPO:
  hyperparameters:
    reward_norm: True
    advantage_norm: True
    value_loss_clipping: True
    entropy_decay: False
    min_entropy_coef: 0
    lr_decay: True
    lr_decay_rate: 0.01
    learning_rate_actor: 0.001
    learning_rate_critic: 0.001
    gamma: 0.99
    lam: 0.9
    clip_ratio: 0.2
    value_coef: 0.5
    entropy_coef: 0.001
    max_grad_norm: 0.5
    num_trajectories: 30
    num_epochs: 10
    num_minibatches: 30

  nn_architecture_actor:
    structure: "DNN"
    num_layers: 3
    num_neurons: 64
    activation_layers: "tanh"
    activation_output:

  nn_architecture_critic:
    structure: "DNN"
    num_layers: 1
    num_neurons: 64
    activation_layers: "tanh"
    activation_output:

  eval_settings:
    eval_interval: 100
    evaluation_treshold: 0.000
    evaluation_episodes: 100