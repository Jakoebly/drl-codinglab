DQN:
  hyperparameters:
    gamma: 0.95
    epsilon: 1.0
    epsilon_min: 0.118
    epsilon_decay: 0.985
    learning_rate: 0.0000105
    batch_size: 256
    target_update_interval: 150
    buffer_size: 200000

  extensions: ["vanilla"]

  extension_parameters:
    replay:
      alpha: 0.65
      beta: 0.45
    noisy:
      std_init: 0.05
    distribution:
      v_min: -10
      v_max: 10
      num_atoms: 51
    dueling:
      num_layers_stream: 1
      num_neurons_stream: 512
    multi_step:
      n_steps: 3

  nn_architecture:
    structure: "DNN"
    num_layers: 5
    num_neurons: 512
    activation_layers: "tanh"
    activation_output:

  eval_settings:
    eval_interval: 100
    evaluation_treshold: 0.000
    evaluation_episodes: 100

PPO:
  hyperparameters:
    learning_rate_actor: 0.00003
    learning_rate_critic: 0.00003
    gamma: 0.99
    lam: 0.95
    clip_ratio: 0.2
    value_coef: 0.5
    entropy_coef: 0.02
    max_grad_norm: 0.5
    num_trajectories: 50
    num_epochs: 4
    num_minibatches: 4
    target_kl: 0.015
    warm_up_period: 400

  nn_architecture_actor:
    structure: "DNN"
    num_layers: 3
    num_neurons: 128
    activation_layers: "tanh"
    activation_output:

  nn_architecture_critic:
    structure: "DNN"
    num_layers: 3
    num_neurons: 128
    activation_layers: "tanh"
    activation_output:

  eval_settings:
    eval_interval: 100
    evaluation_treshold: 0.000
    evaluation_episodes: 100

SAC:
  gamma: 000
  initial_alpha: 000
  alpha_decay: 000
  rho: 000
  mem_maxlen: 000
  batch_size: 000
  learning_rate: 000