PPO:
  hyperparameters:
    advantage_norm: true
    clip_ratio: 0.2
    entropy_coef: 0.001
    entropy_decay: false
    gamma: 0.99
    lam: 0.9
    learning_rate_actor: 0.001
    learning_rate_critic: 0.001
    lr_decay: true
    lr_decay_rate: 0.01
    max_grad_norm: 0.5
    min_entropy_coef: 0
    num_epochs: 10
    num_minibatches: 30
    num_trajectories: 30
    reward_norm: true
    target_kl: 0.015
    value_coef: 0.5
    value_loss_clipping: true
    warm_up_period: 1

  nn_architecture_actor:
    structure: "DNN"
    num_layers: 3
    num_neurons: 64
    activation_layers: "tanh"
    activation_output:

  nn_architecture_critic:
    structure: "DNN"
    num_layers: 1
    num_neurons: 64
    activation_layers: "tanh"
    activation_output:

  eval_settings:
    eval_interval: 100
    evaluation_treshold: 0.000
    evaluation_episodes: 100