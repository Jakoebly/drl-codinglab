PPO:
  hyperparameters:
    reward_norm: True
    advantage_norm: True
    value_loss_clipping: True
    entropy_decay: False
    min_entropy_coef: 0
    lr_decay: True
    lr_decay_rate: 0.01
    learning_rate_actor: 0.001
    learning_rate_critic: 0.001
    gamma: 0.99
    lam: 0.9
    clip_ratio: 0.2
    value_coef: 0.5
    entropy_coef: 0.001
    max_grad_norm: 0.5
    num_trajectories: 30
    num_epochs: 10
    num_minibatches: 30

  nn_architecture_actor:
    structure: "DNN"
    num_layers: 3
    num_neurons: 64
    activation_layers: "tanh"
    activation_output:

  nn_architecture_critic:
    structure: "DNN"
    num_layers: 1
    num_neurons: 64
    activation_layers: "tanh"
    activation_output:

  eval_settings:
    eval_interval: 100
    evaluation_treshold: 0.000
    evaluation_episodes: 100